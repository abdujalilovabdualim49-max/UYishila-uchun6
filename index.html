<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Mesh Gradient Background</title>
  <style>
   
    html, body {
  margin: 0;
 padding: 0;
     width: 100%;
      overflow-x: hidden;
      background-color: #03001e; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    /* Aurora Fon */
    .aurora-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1; 
      filter: blur(60px); 
      opacity: 0.85;
      overflow: hidden;
    }

    .aurora-blob {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      mix-blend-mode: screen;
    }

    .blob-blue {
      background: radial-gradient(circle closest-side, #00d2ff, rgba(0, 210, 255, 0));
      top: -20%;
      left: -10%;
      animation: float-around 20s ease-in-out infinite alternate;
    }

    .blob-purple {
      background: radial-gradient(circle closest-side, #7f00ff, rgba(127, 0, 255, 0));
      bottom: -30%;
      right: -10%;
      animation: float-around 25s ease-in-out infinite alternate-reverse;
    }

    .blob-cyan {
      background: radial-gradient(circle closest-side, #00f2fe, rgba(0, 242, 254, 0));
      top: 30%;
      right: 20%;
      animation: float-around 18s ease-in-out infinite alternate;
    }

    .blob-indigo {
      background: radial-gradient(circle closest-side, #3f51b5, rgba(63, 81, 181, 0));
      bottom: 10%;
      left: 20%;
      animation: float-around 22s ease-in-out infinite alternate-reverse;
    }

    @keyframes float-around {
      0% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
      50% { transform: translate(120px, 80px) scale(1.2) rotate(180deg); }
      100% { transform: translate(-60px, 150px) scale(0.9) rotate(360deg); }
    }


    .hero-text {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }


   

    .bir h1 {
      font-size: 2.5rem;
      text-align: center;
    }
    .kol{
        background: #020024;
background: linear-gradient(90deg, rgba(2, 0, 36, 1) 0%, rgba(48, 48, 133, 1) 42%, rgba(0, 212, 255, 1) 100%);
padding-bottom: 10px;
padding-left: 10px;
padding-right: 10px;
padding-top: 10px;

border-radius: 20px;
    }
    .kotta{
        display: flex;
        align-items: center;
        margin-left: 50px;
        gap: 50px;
     
    }
   
.kol-link {
  text-decoration: none;
  color: inherit;
  display: inline-block;
  cursor: pointer;
  transition: transform 0.3s ease;
}


.kol-link:hover {
  transform: scale(1.05);
}

  </style>
</head>
<body>


  <div class="aurora-bg">
    <div class="aurora-blob blob-blue"></div>
    <div class="aurora-blob blob-purple"></div>
    <div class="aurora-blob blob-cyan"></div>
    <div class="aurora-blob blob-indigo"></div>
  </div>


  <div class="hero-text">
    <h1>✨ Salom! Mening ismim Abdualim 👨‍💻 <br>
    
  🚀 Keling, yaqinroq tanishamiz! 🤝</h1>
  </div>


  <div class="kotta">
    <div class="bir">
   <h1 class="kol"><a href="index1.html">👨‍💻 Men haqimda</a></h1>
    </div>
    <div class="bir">
      <h1 class="kol"><a href="">🎯 Mening qiziqishlarim</a></h1>
    </div>
    <div class="bir">
        <h1 class="kol"><a href="">📉 Maqsadlarim</a></h1>
    </div>
  </div>

</body>
</html>
